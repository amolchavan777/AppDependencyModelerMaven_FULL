openapi: 3.0.0
info:
  title: AuthGateway
  version: 1.2.0
paths:
  /login:
    post:
      summary: Authenticate user
      x-calls:
        - CustomerService
  /2fa/send:
    post:
      summary: Send 2FA token
      x-calls:
        - NotificationEngine
  /session:
    get:
      summary: Validate session
      x-calls:
        - SessionService
        - RedisStore
  /transfer:
    post:
      summary: Transfer funds
      x-calls:
        - PaymentGateway
        - FraudService
  /loans:
    get:
      summary: Loan applications
      x-calls:
        - LoanService
  /balance:
    get:
      summary: Check balance
      x-calls:
        - CoreBanking
  /alerts:
    post:
      summary: Issue alert
      x-calls:
        - FraudService
        - NotificationEngine
